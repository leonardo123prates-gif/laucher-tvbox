name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Inicio-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Print APK (base64 + sha256)
        if: github.event_name == 'workflow_dispatch'
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          echo "BEGIN_APK_B64"
          base64 -w0 app/build/outputs/apk/debug/app-debug.apk
          echo
          echo "END_APK_B64"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Inicio-launcher.apk
          gh release create "apk-${{ github.run_number }}" Inicio-launcher.apk --title "Launcher Inicio (build ${{ github.run_number }})" --notes "APK pronto para instalar com adb install -r"
