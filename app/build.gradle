plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boxlauncher.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.boxlauncher.tv"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
